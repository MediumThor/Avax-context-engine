[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avax-context-engine"
version = "0.1.0"
description = "Persistent multi-timeframe AVAX context and probabilistic forecasting research system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
